<!DOCTYPE html>
<html lang="en-US">
   <head>
      <title data-cy="migration-title">{{ title }}</title>
      <meta
         http-equiv="Content-Security-Policy"
         content="default-src 'self';
                  style-src 'self' 'nonce-{{ csp_nonce }}';
                  script-src 'self' 'nonce-{{ csp_nonce }}';
                  img-src 'self' data:;"
         />
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      {% comment %}
        Shown while migrations are pending, which includes every upgrade, so
        it must not depend on collected static files: during an upgrade they
        may belong to the previous version, or not be collected yet.
      {% endcomment %}
      <style nonce="{{ csp_nonce }}">
         :root { color-scheme: light dark; --fg: #15171a; --bg: #f4f5f4; --accent: #1d9e75; }
         @media (prefers-color-scheme: dark) { :root { --fg: #f4f5f4; --bg: #15171a; } }
         body { margin: 0; min-height: 100vh; display: grid; place-items: center;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                color: var(--fg); background: var(--bg); text-align: center; }
         .spinner { width: 48px; height: 48px; margin: 0 auto 24px; border-radius: 50%;
                    border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent);
                    border-top-color: var(--accent); animation: spin 1s linear infinite; }
         @keyframes spin { to { transform: rotate(360deg); } }
         @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
         h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
         p { margin: 0; opacity: .75; }
      </style>
      <script nonce="{{ csp_nonce }}">
         setInterval(function() {
         window.location = '/';
         }, 10000);
      </script>
   </head>
   <body>
      <main>
         <div class="spinner" role="progressbar" aria-valuetext="{{ aria_spinner }}"></div>
         <h1 data-cy="migration-message-upgrade">{{ message_upgrade }}</h1>
         <p>{{ message_refresh }}</p>
      </main>
   </body>
</html>
